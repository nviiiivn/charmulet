# The NES-cartridge theme. Pure data — hot-swappable at runtime later.
name = "nes-cartridge"

[colors]
background = "#1a1a2e"
foreground = "#e0e0e0"
accent = "#e43b44"
secondary = "#2de2e6"
muted = "#565f89"
tab_active_bg = "#e43b44"
tab_active_fg = "#ffffff"
tab_inactive_bg = "#16213e"
tab_inactive_fg = "#8b9bb4"
status_bg = "#16213e"
status_fg = "#e0e0e0"
